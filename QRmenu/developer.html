
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRMenu - Kurulum Yönetimi</title>

    <link rel="stylesheet" href="css/admin.css">
</head>

<body>

<header>
    <div class="header-inner">
        <h2>QRMenu Yönetim</h2>
        <span>Kurulum Yöneticisi</span>
        <button class="secondary" onclick="logout()">Çıkış Yap</button>
    </div>
</header>

<main>
       <section class="panel">
        <h3>İşletme Kaydı</h3>

        <p id="registrationStatus">
            Kayıt ayarı yükleniyor...
        </p>

        <button
            type="button"
            id="toggleRegistrationButton"
            class="secondary"
            disabled
        >
            Yükleniyor...
        </button>
    </section>
    <section class="panel">
        <h3>Kayıtlı İşletmeler</h3>

        <div id="businessList">
            <div class="empty">İşletmeler yükleniyor...</div>
        </div>
    </section>

</main>

<script src="js/developer.js"></script>

</body>
</html>
