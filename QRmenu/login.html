
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRMenu - Giriş</title>

    <link rel="stylesheet" href="css/admin.css">
</head>

<body>

<header>
    <div class="header-inner">
        <h2>QRMenu</h2>
        <span>Yönetim Paneli Girişi</span>
    </div>
</header>

<main>

    <section class="panel">
        <h3>Hesabınıza Giriş Yapın</h3>

        <form id="loginForm">

            <label>E-posta</label>
            <input
                type="email"
                id="email"
                required
                placeholder="E-posta adresiniz"
            >

            <label>Şifre</label>
            <input
                type="password"
                id="password"
                required
                placeholder="Şifreniz"
            >

            <button type="submit" class="primary">
                Giriş Yap
            </button>

            <p id="loginMessage"></p>

        </form>

        <p>
            Henüz hesabınız yok mu?
            <a href="register.html">İşletme Kaydı Oluştur</a>
        </p>

    </section>

</main>

<script src="js/login.js"></script>

</body>
</html>
