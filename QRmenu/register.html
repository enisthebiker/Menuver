
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRMenu - İşletme Kaydı</title>

    <link rel="stylesheet" href="css/admin.css">
</head>

<body>

<header>
    <div class="header-inner">
        <h2>QRMenu</h2>
        <span>Yeni İşletme Kaydı</span>
    </div>
</header>

<main>

    <section class="panel">
        <h3>İşletme Hesabı Oluştur</h3>

        <form id="registerForm">

            <label>İşletme adı</label>
            <input
                type="text"
                id="businessName"
                required
                maxlength="150"
                placeholder="Örn. Demo Cafe"
            >

            <label>Kullanıcı adı</label>
            <input
                type="text"
                id="username"
                required
                maxlength="100"
                placeholder="Kullanıcı adınız"
            >

            <label>E-posta</label>
            <input
                type="email"
                id="email"
                required
                maxlength="150"
                placeholder="ornek@mail.com"
            >

            <label>Şifre</label>
            <input
                type="password"
                id="password"
                required
                minlength="8"
                placeholder="En az 8 karakter"
            >

            <button type="submit" class="primary">
                Kayıt Ol
            </button>

            <p id="registerMessage"></p>

        </form>

        <p>
            Zaten hesabınız var mı?
            <a href="login.html">Giriş Yap</a>
        </p>

    </section>

</main>

<script src="js/register.js"></script>

</body>
</html>
